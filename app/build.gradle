apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    ndkVersion "21.4.7075599"

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
}

dependencies {
}
